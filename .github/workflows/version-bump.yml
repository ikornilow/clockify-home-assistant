name: Version bump

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Test commit parsing
        run: python -m unittest discover -s tests
      - name: Tag merged release
        id: tag_release
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/clockify/manifest.json"))["version"])')
          tag="v${version}"
          latest_tag=$(git describe --tags --abbrev=0)
          if [ "$tag" != "$latest_tag" ]; then
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              echo "::error::Release tag $tag already exists but is not the latest tag."
              exit 1
            fi
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Calculate version and update changelog
        if: steps.tag_release.outputs.released != 'true'
        run: python scripts/bump_version.py
      - name: Open release pull request
        if: steps.tag_release.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No version change required."
            exit 0
          fi
          version=$(python -c 'import json; print(json.load(open("custom_components/clockify/manifest.json"))["version"])')
          branch="release/v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/clockify/manifest.json CHANGELOG.md
          git commit -m "chore(release): v${version}"
          git push --force-with-lease origin "HEAD:refs/heads/${branch}"
          open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            echo "Release pull request #$open_pr is already open."
          else
            closed_pr=$(gh pr list --head "$branch" --state closed --json number --jq '.[0].number // empty')
            if [ -n "$closed_pr" ]; then
              gh pr reopen "$closed_pr"
            else
              gh pr create --base main --head "$branch" \
                --title "chore(release): v${version}" \
                --body "Automated release update for v${version}. Merge this pull request to publish the version tag."
            fi
          fi
