name: Version bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test commit parsing
        run: python -m unittest discover -s tests
      - name: Calculate version and update changelog
        run: python scripts/bump_version.py
      - name: Commit and tag release
        run: |
          if git diff --quiet; then
            echo "No version change required."
            exit 0
          fi
          version=$(python -c 'import json; print(json.load(open("custom_components/clockify/manifest.json"))["version"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/clockify/manifest.json CHANGELOG.md
          git commit -m "chore(release): v${version}"
          git tag -a "v${version}" -m "v${version}"
          git push origin HEAD:main "v${version}"
